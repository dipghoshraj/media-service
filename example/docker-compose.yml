version: "3.9"

services:
  web:
    build: .
    container_name: flask-gunicorn
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: flask-nginx
    ports:
      - "5050:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/agni.local.internal.pem:/etc/ssl/certs/server.pem:ro
      - ./app/agni.local.internal-key.pem:/etc/ssl/private/server.key:ro
    depends_on:
      - web