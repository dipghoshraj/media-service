syntax = "proto3";

package tunnel.v1;
option go_package = "agni-cli/proto";

// Bi-directional tunnel stream
service TunnelService {
  rpc TunnelStream(stream Envelope) returns (stream Envelope);
}

// === Envelope wraps all message types ===
syntax = "proto3";

service TunnelService {
  rpc TunnelStream(stream Envelope) returns (stream Envelope);
}

message ConnectRequest {
  string agent_id = 1;
  string token = 2;
  int64 timestamp = 3;
  string nonce = 4;
  string signature = 5;
}

message ConnectAck {
  string agent_id = 1;
  string message = 2;
}

message TunnelOpen {
  string id = 1;
  string method = 2;
  string path = 3;
  map<string, string> headers = 4;
}

message TunnelData {
  string id = 1;
  bytes chunk = 2;
}

message TunnelClose {
  string id = 1;
  string reason = 2;
}

message Control {
  enum Type {
    PING = 0;
    PONG = 1;
    ERROR = 2;
  }
  Type type = 1;
  string payload = 2;
}

message Envelope {
  oneof message {
    ConnectRequest connect_request = 1;
    ConnectAck connect_ack = 2;
    TunnelOpen open = 3;
    TunnelData data = 4;
    TunnelClose close = 5;
    Control control = 6;
  }
}


// protoc --go_out=. --go-grpc_out=. --go_opt=paths=source_relative --go-grpc_opt=paths=source_relative proto/tunnel.proto